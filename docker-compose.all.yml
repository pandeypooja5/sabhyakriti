version: "3.9"

x-common-env: &common-env
  ENVIRONMENT: development
  INTERNAL_SERVICE_SECRET: local-dev-secret-change-in-prod
  JWT_PUBLIC_KEY_URL: http://auth-service:8001/.well-known/jwks.json
  LOG_LEVEL: DEBUG

x-db-primary: &db-primary
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sabhyakriti
  DATABASE_PRIMARY_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sabhyakriti
  DATABASE_REPLICA_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sabhyakriti

x-service-urls: &service-urls
  AUTH_SERVICE_URL: http://auth-service:8001
  PRODUCT_SERVICE_URL: http://product-service:8002
  CART_SERVICE_URL: http://cart-service:8003
  ORDER_SERVICE_URL: http://order-service:8004
  PAYMENT_SERVICE_URL: http://payment-service:8005
  NOTIFICATION_SERVICE_URL: http://notification-service:8006

x-hc-timing: &hc-timing
  interval: 20s
  timeout: 8s
  retries: 5
  start_period: 60s

services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sabhyakriti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  auth-service:
    build: { context: ./sabhyakriti-auth-service, dockerfile: Dockerfile }
    ports: ["8001:8001"]
    environment:
      <<: [*common-env, *db-primary]
      PORT: 8001
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:5173
    env_file: [".env.local"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8001/health').raise_for_status()\""]
      <<: *hc-timing

  product-service:
    build: { context: ./sabhyakriti-product-service, dockerfile: Dockerfile }
    ports: ["8002:8002"]
    environment:
      <<: [*common-env, *db-primary, *service-urls]
      PORT: 8002
      REDIS_URL: redis://redis:6379/1
      S3_BUCKET_NAME: ${R2_BUCKET_NAME:-local-dev-bucket}
      CLOUDFRONT_DOMAIN: localhost:8002/uploads/local
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-sabhyakriti-images}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:-}
    env_file: [".env.local"]
    volumes:
      - ./sabhyakriti-product-service/uploads:/app/uploads
    depends_on:
      auth-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8002/health').raise_for_status()\""]
      <<: *hc-timing

  cart-service:
    build: { context: ./sabhyakriti-cart-service, dockerfile: Dockerfile }
    ports: ["8003:8003"]
    environment:
      <<: [*common-env, *db-primary, *service-urls]
      PORT: 8003
      FRONTEND_ORIGIN: http://localhost:5173
    env_file: [".env.local"]
    depends_on:
      product-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8003/health').raise_for_status()\""]
      <<: *hc-timing

  order-service:
    build: { context: ./sabhyakriti-order-service, dockerfile: Dockerfile }
    ports: ["8004:8004"]
    environment:
      <<: [*common-env, *db-primary, *service-urls]
      PORT: 8004
      SELLER_GSTIN: 27AAPFU0939F1ZV
      SELLER_ADDRESS: "Sabhyakriti, Mumbai, Maharashtra - 400001"
      FRONTEND_ORIGIN: http://localhost:5173
    env_file: [".env.local"]
    depends_on:
      cart-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8004/health').raise_for_status()\""]
      <<: *hc-timing

  payment-service:
    build: { context: ./sabhyakriti-payment-service, dockerfile: Dockerfile }
    ports: ["8005:8005"]
    environment:
      <<: [*common-env, *db-primary, *service-urls]
      PORT: 8005
      FRONTEND_ORIGIN: http://localhost:5173
    env_file: [".env.local"]
    depends_on:
      order-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8005/health').raise_for_status()\""]
      <<: *hc-timing

  notification-service:
    build: { context: ./sabhyakriti-notification-service, dockerfile: Dockerfile }
    ports: ["8006:8006"]
    environment:
      <<: [*common-env, *db-primary, *service-urls]
      PORT: 8006
      SES_FROM_EMAIL: no-reply@sabhyakriti.com
      SES_FROM_NAME: Sabhyakriti
    env_file: [".env.local"]
    depends_on:
      auth-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8006/health').raise_for_status()\""]
      <<: *hc-timing

  admin-service:
    build: { context: ./sabhyakriti-admin-service, dockerfile: Dockerfile }
    ports: ["8007:8007"]
    environment:
      <<: [*common-env, *service-urls]
      PORT: 8007
      FRONTEND_ORIGIN: http://localhost:5173
    env_file: [".env.local"]
    depends_on:
      order-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8007/health').raise_for_status()\""]
      <<: *hc-timing

volumes:
  postgres_data:
  redis_data:
