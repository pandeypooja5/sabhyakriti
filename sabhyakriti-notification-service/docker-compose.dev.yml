version: "3.9"

services:
  # ── PostgreSQL 15 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: notification-postgres
    environment:
      POSTGRES_DB: sabhyakriti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Notification Service ─────────────────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: sabhyakriti-notification-service
    ports:
      - "8006:8006"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sabhyakriti
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app   # hot-reload in dev (remove in prod)
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8006
      --workers 1
      --reload
    restart: unless-stopped

volumes:
  postgres_data:
