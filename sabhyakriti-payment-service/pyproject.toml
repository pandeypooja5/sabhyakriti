[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sabhyakriti-payment-service"
version = "0.1.0"
description = "Payment microservice for Sabhyakriti Saree eCommerce platform"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "ANN101", # Missing type annotation for `self`
    "ANN102", # Missing type annotation for `cls`
    "S101",   # Use of `assert` detected (tests)
    "S105",   # Possible hardcoded password
    "S106",   # Possible hardcoded password
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["ANN", "S", "N"]
"alembic/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=80 --cov-omit=tests/*,alembic/*"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "alembic/*", "*/conftest.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
